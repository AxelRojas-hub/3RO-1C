<!DOCTYPE html>
<html>
  <head>
    <title>Layout usando Table</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      table {
        width: 90%;
        height: 90dvh;
        border-collapse: collapse; /* Elimina espacios entre celdas */
      }

      td {
        border: 1px solid #ccc;
        padding: 0; /* Elimina el padding */
        text-align: center;
      }
      td img {
        display: block;
        width: 100%;
        height: 100%; /* Asegura que las imágenes llenen las celdas */
        object-fit: cover; /* Ajusta la imagen sin distorsión */
      }
      .left-column td {
        height: 8.33%; /* Divide la columna izquierda en 12 filas iguales */
      }
      .right-column td {
        width: 100%;
        height: 25%; /* Divide la columna izquierda en 4 filas iguales */
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <!-- Columna izquierda -->
        <td width="20%">
          <table class="left-column">
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
            <tr>
              <td></td>
            </tr>
          </table>
        </td>
        <!-- Columna derecha -->
        <td width="80%">
          <table class="right-column">
            <tr>
              <td>
                <img src="alemania2.JPG" alt="Imagen 1" />
              </td>
            </tr>
            <tr>
              <td>
                <img src="imagen9.jpg" alt="Imagen 2" />
              </td>
            </tr>
            <tr>
              <td>
                <img src="imagen10.jpg" alt="Imagen 3" />
              </td>
            </tr>
            <tr>
              <td>
                <img src="imagen11.jpg" alt="Imagen 4" />
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
